<title>サブエージェントの仕組み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">

<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body,h1,h2,p,figure,figcaption{margin:0;padding:0;}

  :root{
    --ink:#0A1A33;
    --ink-2:#13294C;
    --panel:rgba(255,255,255,.045);
    --line:rgba(238,244,250,.16);
    --orange:#F26430;
    --orange-soft:#FFB27A;
    --cyan:#5FC6D8;
    --paper:#EEF4FA;
    --muted:rgba(238,244,250,.60);
    --display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 90% at 88% 4%, #1C3A6B 0%, rgba(28,58,107,0) 58%),
      radial-gradient(90% 70% at 0% 100%, #10254A 0%, rgba(16,37,74,0) 60%),
      var(--ink);
    color:var(--paper);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the slide: a fixed 16:9 stage, everything sized from its width ---- */
  .stage{
    container-type:inline-size;
    width:min(100%, calc((100vh - 32px) * 16 / 9));
    min-width:0;
    flex:0 1 auto;
  }
  .slide{
    width:100%;
    aspect-ratio:16/9;
    background:
      linear-gradient(158deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 46%),
      var(--ink-2);
    border:1px solid var(--line);
    border-radius:1.1cqw;
    box-shadow:0 2.2cqw 5cqw rgba(3,10,22,.55);
    padding:2.6cqw 2.9cqw 2.3cqw;
    display:flex;
    flex-direction:column;
    gap:1.5cqw;
    overflow:hidden;
    position:relative;
  }
  .slide::before{ /* the one bold mark: an orange rule anchoring the top-left */
    content:"";
    position:absolute; left:0; top:0;
    width:12cqw; height:.42cqw;
    background:linear-gradient(90deg,var(--orange),rgba(242,100,48,0));
  }

  /* ---- header ---- */
  header{
    display:grid;
    grid-template-columns:minmax(0,auto) minmax(0,1fr);
    align-items:end;
    column-gap:3cqw;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:.95cqw;
    letter-spacing:.22em;
    color:var(--orange-soft);
    text-transform:uppercase;
    margin-bottom:.7cqw;
  }
  h1{
    font-family:var(--display);
    font-weight:900;
    font-size:3.35cqw;
    line-height:1.06;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  h1 .accent{color:var(--orange);}
  .lead{
    font-size:1.18cqw;
    line-height:1.75;
    color:var(--paper);
    border-left:.22cqw solid var(--orange);
    padding-left:1.1cqw;
    max-width:44cqw;
    justify-self:end;
  }
  .lead b{font-weight:700;color:var(--orange-soft);}

  /* ---- figure ---- */
  figure{flex:1;min-height:0;display:flex;flex-direction:column;}
  .scroll{flex:1;min-height:0;display:flex;overflow-x:auto;}
  svg{display:block;width:100%;height:100%;}
  figcaption{
    margin-top:.9cqw;
    font-size:1.02cqw;
    line-height:1.5;
    color:var(--muted);
  }
  figcaption b{color:var(--cyan);font-weight:500;}

  /* ---- takeaways ---- */
  .points{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1.1cqw;
  }
  .point{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:.65cqw;
    padding:.95cqw 1.1cqw;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:.85cqw;
    align-items:baseline;
  }
  .point .n{
    font-family:var(--mono);
    font-size:1.05cqw;
    color:var(--orange);
  }
  .point h2{
    font-family:var(--display);
    font-weight:700;
    font-size:1.32cqw;
    line-height:1.3;
  }
  .point p{
    grid-column:2;
    margin-top:.3cqw;
    font-size:1.02cqw;
    line-height:1.5;
    color:var(--muted);
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:.9cqw;
    letter-spacing:.14em;
    color:rgba(238,244,250,.34);
  }

  @media (max-width:720px){
    .slide{aspect-ratio:auto;width:100%;padding:6cqw 5cqw;gap:4cqw;}
    header{grid-template-columns:1fr;row-gap:3cqw;}
    h1{font-size:8cqw;}
    .eyebrow{font-size:2.6cqw;}
    .lead{font-size:3.3cqw;max-width:none;justify-self:start;padding-left:3cqw;border-left-width:.7cqw;}
    figcaption{font-size:2.9cqw;margin-top:3cqw;}
    .points{grid-template-columns:1fr;gap:2.6cqw;}
    .point{border-radius:2cqw;padding:2.6cqw 3cqw;}
    .point .n{font-size:2.9cqw;}
    .point h2{font-size:3.9cqw;}
    .point p{font-size:2.9cqw;}
    footer{font-size:2.4cqw;}
    .scroll{display:block;}
    .scroll svg{min-width:640px;height:auto;}
  }
</style>

<div class="stage">

    </div>

      <span class="n">02</span>
      <h2>同時に進む</h2>

    </div>
    <div class="point">

      <h2>戻るのは結論だけ</h2>
